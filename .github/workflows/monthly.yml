name: NAVER DART monthly update
on:
  schedule:
    - cron: '17 1 1 * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Re-query every structured financial period
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'build_site.py'
      - 'web/**'
      - 'config/**'
      - 'data/manual_verified.json'
      - 'requirements.txt'
      - '.github/workflows/monthly.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: naver-monthly-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect and build
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FULL_REFRESH: ${{ inputs.full_refresh }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FULL_REFRESH" = "true" ]; then
            python agent.py --full
          else
            python agent.py
          fi
      - name: Commit archives and site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'Update NAVER DART archive and financial dashboard'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
